<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  {{ $socialTitle := .Title }}
  {{ if .IsHome }}{{ $socialTitle = "catalogue | an imprint of analogue press" }}{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ $socialTitle }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "images/catalogue-social.jpg" | absURL }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="853">
  <meta property="og:image:alt" content="An antique engraving of a woman holding astronomical instruments beneath stars, beside a large flea.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ $socialTitle }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ "images/catalogue-social.jpg" | absURL }}">
  <meta name="twitter:image:alt" content="An antique engraving of a woman holding astronomical instruments beneath stars, beside a large flea.">
  <meta name="theme-color" content="#0f0e0e">
  {{ if not .IsHome }}<meta name="robots" content="noindex">{{ end }}
  {{ with resources.Get "css/global.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
  <script src="/js/catalogue.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="https://analoguegroup.org/" aria-label="Analogue">
      <img src="/brand/logos/analogue-mark.svg" alt="">
      <img src="/brand/logos/analogue-wordmark.svg" alt="Analogue">
    </a>
  </header>
  <main id="main">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer">
    <div class="footer-brand">
      <a href="https://analoguegroup.org/" aria-label="Analogue"><img src="/brand/logos/analogue-wordmark.svg" alt="Analogue"></a>
      <a href="https://analogue.press">analogue.press <span aria-hidden="true">↗</span></a>
    </div>
    <a href="#main">Back to top ↑</a>
  </footer>
</body>
</html>
